name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --locked --python 3.11

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Validate Marimo notebook
        run: uv run marimo check --strict app.py

      - name: Smoke test Marimo app
        shell: bash
        run: |
          uv run marimo run app.py --headless --host 127.0.0.1 --port 2718 > marimo.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:2718/ > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat marimo.log
              exit 1
            fi
            sleep 1
          done

          cat marimo.log
          exit 1

      - name: Build interactive Pages app
        run: uv run python scripts/build_pages.py

      - name: Install browser test runtimes
        run: uv run playwright install --with-deps chromium firefox

      - name: Test browser app at the Pages path
        run: uv run pytest browser_tests

      - name: Upload tested Pages artifact
        if: github.repository == 'magoo/annual-loss-distribution' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.repository == 'magoo/annual-loss-distribution' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
